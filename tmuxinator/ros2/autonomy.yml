# ~/.tmuxinator/autonomy.yml 

name: autonomy
root: ~/
windows:
  - odometry:
      layout: tiled 
      panes:
        - dlio:
          - cdg
          - sleep 5  
          - ros2 launch direct_lidar_inertial_odometry dlio.launch.py 
        - confidence_mapping:
          - cde 
          - history -s 'ros2 launch confidence_mapping confidence_map.launch.py'
        - stage_planner:
          - cde 
          - history -s 'ros2 launch stage_planner stage_planner.launch.py' 
        - rosbag:
          - cd rosbags


  - sensors:
      # layout: main-vertical 
      layout: tiled 
      panes:
        - ouster:
          - cds
          - sleep 1  
          - ros2 launch ouster_ros driver.launch.py 
        - vectornav:
          - cds 
          - sleep 1 
          - ros2 launch vectornav vectornav.launch.py 
        - simulated_tf:  
          - cds 
          - sleep 1
          - ros2 run tf2_ros static_transform_publisher 0.00 0 -0.0 3.14 0 0 husky/base_link simulated_frame
        # - hesai_lidar: 
        #   - cds 
        #   - sleep 1
          # - ros2 launch hesai_ros_driver start.py
        # - thermal_camera:
        #   - cds 
        #   - sleep 1
          # - ros2 launch flir_boson_usb flir_boson.launch.xml
        # - gemini:
        #   - cds 
        #   - sleep 1
          # - ros2 launch orbbec_camera gemini2XL.launch.py
        - camera_tf: 
          - cde 
          - sleep 1
          # - ros2 run tf2_ros static_transform_publisher 0.09 0 -0.10 0 0 0 husky/base_link camera_link
          - ros2 run tf2_ros static_transform_publisher --x 0.09 --y -0.0 --z -0.11 --qx -0.500561942 --qy 0.498875259 --qz -0.49989832 --qw 0.50066174 --frame-id /husky/base_link --child-frame-id camera_color_optical_frame

        - hesai_tf: 
          - cde 
          - sleep 1
          - ros2 run tf2_ros static_transform_publisher 0.05 0 -0.19 0 0 0 husky/base_link husky/hesai_lidar





